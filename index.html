<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2D5A3D">
<title>BILA · 全年同行</title>
<style>
/* ===== 全局设计 ===== */
:root {
  --primary: #2D5A3D;
  --primary-light: #4A7A5A;
  --gold: #C9A96E;
  --gold-light: #E8D5B8;
  --warm-bg: #FDF8F0;
  --card: #FFFFFF;
  --text: #2C2C2C;
  --muted: #8A7E72;
  --shadow: 0 8px 32px rgba(45, 60, 50, 0.08);
  --shadow-hover: 0 12px 48px rgba(45, 60, 50, 0.14);
  --radius: 20px;
  --radius-sm: 12px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-serif: "Georgia", "SimSun", "Songti SC", serif;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
* { box-sizing: border-box; margin: 0; }
body {
  font-family: var(--font);
  background: var(--warm-bg);
  color: var(--text);
  padding: 20px 16px 100px;
  max-width: 600px;
  margin: 0 auto;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 99px; }
::-webkit-scrollbar-track { background: transparent; }

.app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  padding: 0 2px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand .icon {
  font-size: 32px;
  background: var(--card);
  width: 48px;
  height: 48px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow);
}
.brand-text { line-height: 1.2; }
.brand-text .name {
  font-size: 22px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: 1px;
}
.brand-text .sub {
  font-size: 12px;
  color: var(--muted);
  font-weight: 400;
  letter-spacing: 2px;
}
.header-right { display: flex; gap: 8px; }
.icon-btn {
  background: var(--card);
  border: none;
  border-radius: 12px;
  padding: 10px 14px;
  cursor: pointer;
  font-size: 16px;
  box-shadow: var(--shadow);
  transition: var(--transition);
  color: var(--muted);
}
.icon-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }

.user-area {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px 20px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  border: 1px solid rgba(201, 169, 110, 0.15);
}
.user-area label {
  font-weight: 500;
  font-size: 13px;
  color: var(--muted);
}
.user-area input {
  flex: 1;
  min-width: 100px;
  padding: 10px 16px;
  border: 1.5px solid #E8E0D8;
  border-radius: 10px;
  font-size: 14px;
  background: var(--warm-bg);
  transition: var(--transition);
  font-family: var(--font);
}
.user-area input:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.15); }
.user-area .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
.user-area .user-btn {
  background: var(--primary);
  color: #fff;
  border: none;
  padding: 10px 22px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 500;
  font-size: 14px;
  transition: var(--transition);
}
.user-area .user-btn:hover { background: var(--primary-light); transform: translateY(-1px); }
.user-area .guest-btn {
  background: var(--warm-bg);
  color: var(--text);
  border: 1px solid #E8E0D8;
  padding: 10px 22px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 500;
  font-size: 14px;
  transition: var(--transition);
}
.user-area .guest-btn:hover { background: #F0E8E0; }
.user-status {
  font-size: 12px;
  color: var(--muted);
  padding: 4px 12px;
  background: var(--warm-bg);
  border-radius: 99px;
}

.stats {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px 16px;
  box-shadow: var(--shadow);
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  margin-bottom: 12px;
  border: 1px solid rgba(201, 169, 110, 0.10);
}
.stats .item { text-align: center; flex: 1; min-width: 56px; }
.stats .item .num {
  font-size: 28px;
  font-weight: 700;
  color: var(--primary);
  line-height: 1.2;
  letter-spacing: -0.5px;
}
.stats .item .label { font-size: 11px; color: var(--muted); margin-top: 4px; letter-spacing: 1px; }

.calibration-status {
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 12px 18px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 13px;
  border-left: 4px solid var(--gold);
}
.calibration-status .badge {
  padding: 4px 14px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 600;
}
.calibration-status .badge.done { background: #E8F0E8; color: var(--primary); }
.calibration-status .badge.pending { background: #F5EDE0; color: #A08060; }

.progress-wrap {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px 20px 16px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
  border: 1px solid rgba(201, 169, 110, 0.10);
}
.progress-wrap .top {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--muted);
}
.progress-bar {
  height: 6px;
  background: #F0EAE0;
  border-radius: 99px;
  overflow: hidden;
  margin: 10px 0 14px;
}
.progress-bar .fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--gold), var(--primary));
  border-radius: 99px;
  transition: width 0.8s ease;
}

.footprint {
  display: flex;
  justify-content: space-between;
  gap: 4px;
  margin-top: 4px;
}
.footprint .step {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 10px;
  color: var(--muted);
  flex: 1;
  cursor: pointer;
  padding: 8px 4px;
  border-radius: 10px;
  transition: var(--transition);
  background: transparent;
}
.footprint .step:hover { background: var(--warm-bg); }
.footprint .step .icon {
  font-size: 22px;
  transition: var(--transition);
}
.footprint .step.done .icon { opacity: 1; filter: none; }
.footprint .step.active .icon { opacity: 1; animation: pulse-icon 2s ease-in-out infinite; }
.footprint .step.pending .icon { opacity: 0.25; filter: grayscale(0.8); }
.footprint .step .label { font-size: 9px; margin-top: 3px; letter-spacing: 0.5px; }
.footprint .step.filter-active { background: rgba(201, 169, 110, 0.15); border-radius: 10px; }
@keyframes pulse-icon {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}

.week-section { margin-bottom: 24px; }
.week-header {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 0 2px;
  color: var(--primary);
}
.week-header .badge {
  font-size: 11px;
  background: var(--warm-bg);
  padding: 2px 14px;
  border-radius: 99px;
  color: var(--muted);
  font-weight: 400;
}
.week-header .status-badge {
  font-size: 10px;
  padding: 2px 12px;
  border-radius: 99px;
  font-weight: 500;
}
.week-header .status-badge.done { background: #E8F0E8; color: var(--primary); }
.week-header .status-badge.pending { background: #F5EDE0; color: #A08060; }

.day-card {
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  transition: var(--transition);
  border: 1px solid transparent;
}
.day-card:hover {
  border-color: var(--gold-light);
  transform: translateX(4px);
  box-shadow: var(--shadow-hover);
}
.day-card .info { flex: 1; }
.day-card .info .title {
  font-weight: 600;
  font-size: 15px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.day-card .info .title .edit-badge {
  font-size: 10px;
  color: var(--gold);
  font-weight: 400;
}
.day-card .info .meta {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.day-card .info .meta .dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--gold-light);
  display: inline-block;
}
.day-card .status {
  font-size: 20px;
  min-width: 36px;
  text-align: right;
  opacity: 0.6;
}
.day-card.done {
  background: #F8F5F0;
  border-color: rgba(201, 169, 110, 0.2);
}
.day-card.done .status { opacity: 1; color: var(--primary); }
.day-card.sunday {
  border-left: 4px solid var(--gold);
  background: linear-gradient(135deg, #FFFFFF 0%, #FDF8F0 100%);
}
.day-card.sunday .info .title {
  color: var(--primary);
  font-weight: 700;
}
.day-card.sunday .info .title .sunday-tag {
  font-size: 10px;
  background: var(--gold-light);
  color: #8A7A5A;
  padding: 1px 10px;
  border-radius: 99px;
  font-weight: 500;
}

.modal-overlay {
  position: fixed; inset: 0; background: rgba(30, 35, 30, 0.5);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal-content {
  background: var(--card);
  max-width: 520px;
  width: 100%;
  max-height: 94vh;
  overflow-y: auto;
  border-radius: 28px;
  padding: 32px 24px 24px;
  box-shadow: 0 32px 80px rgba(0,0,0,0.18);
  position: relative;
}
.modal-content .close-btn {
  position: sticky; top: 0; float: right;
  font-size: 24px; background: none; border: none;
  cursor: pointer; color: var(--muted); padding: 4px 8px;
  z-index: 2; margin-bottom: -8px;
  transition: var(--transition);
}
.modal-content .close-btn:hover { color: var(--text); transform: rotate(90deg); }
.modal-content .meta-bar {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; color: var(--muted); flex-wrap: wrap; gap: 4px;
  padding-bottom: 8px;
  border-bottom: 1px solid #F0EAE0;
}
.modal-content .meta-bar .cal-tag {
  font-size: 10px; padding: 2px 12px; border-radius: 99px;
}
.modal-content .meta-bar .cal-tag.done { background: #E8F0E8; color: var(--primary); }
.modal-content .meta-bar .cal-tag.pending { background: #F5EDE0; color: #A08060; }

.modal-content .scripture-box {
  background: var(--warm-bg);
  border-radius: 16px;
  padding: 20px 22px;
  margin: 16px 0 18px;
  border-left: 5px solid var(--gold);
  font-family: var(--font-serif);
  font-size: 15px;
  line-height: 2.2;
  color: #1E2A1E;
  letter-spacing: 0.3px;
  white-space: pre-wrap;
  word-break: break-word;
}
.modal-content .scripture-box .ref {
  display: block;
  font-size: 12px;
  color: var(--muted);
  font-family: var(--font);
  font-weight: 600;
  margin-bottom: 8px;
  letter-spacing: 1px;
}
.modal-content .scripture-box .verses { font-size: 15.5px; }

.modal-content .step-indicator {
  display: flex;
  justify-content: space-between;
  margin: 20px 0 16px;
  padding: 0 2px;
}
.modal-content .step-indicator .step-dot {
  flex: 1;
  text-align: center;
  font-size: 10px;
  color: var(--muted);
  padding: 6px 0 4px;
  border-bottom: 2px solid #E8E0D8;
  transition: var(--transition);
}
.modal-content .step-indicator .step-dot.active {
  color: var(--primary);
  border-bottom-color: var(--gold);
  font-weight: 600;
}
.modal-content .step-indicator .step-dot.done {
  color: var(--primary);
  border-bottom-color: var(--primary-light);
}
.modal-content .step-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}
.modal-content .step-guide {
  font-size: 15px;
  color: var(--text);
  margin-bottom: 12px;
  line-height: 1.8;
}
.modal-content .step-action {
  font-size: 13px;
  color: var(--muted);
  font-style: italic;
  margin-top: 12px;
  padding: 10px 16px;
  background: var(--warm-bg);
  border-radius: 10px;
  text-align: center;
}

.modal-content .options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 14px 0;
}
.modal-content .options button {
  background: var(--warm-bg);
  border: 1.5px solid #E8E0D8;
  border-radius: 12px;
  padding: 14px 18px;
  text-align: left;
  font-size: 15px;
  cursor: pointer;
  transition: var(--transition);
  font-family: var(--font);
  color: var(--text);
}
.modal-content .options button:hover {
  border-color: var(--gold);
  background: #F8F0E8;
  transform: translateX(2px);
}
.modal-content .options button.selected {
  border-color: var(--gold);
  background: var(--gold-light);
  font-weight: 600;
  box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.15);
}
.modal-content .declare-box {
  background: var(--gold-light);
  border-radius: 12px;
  padding: 14px 18px;
  margin: 12px 0;
  font-size: 17px;
  font-weight: 600;
  color: var(--primary);
  display: none;
  text-align: center;
}
.modal-content .nav-buttons { display: flex; gap: 10px; margin-top: 18px; }
.modal-content .nav-buttons button {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  font-family: var(--font);
}
.modal-content .nav-buttons .btn-prev {
  background: var(--warm-bg);
  color: var(--text);
}
.modal-content .nav-buttons .btn-prev:hover { background: #F0EAE0; }
.modal-content .nav-buttons .btn-next {
  background: var(--primary);
  color: #fff;
}
.modal-content .nav-buttons .btn-next:hover { background: var(--primary-light); }
.modal-content .nav-buttons .btn-next:disabled { opacity: 0.4; cursor: not-allowed; }
.modal-content .nav-buttons .btn-done {
  background: var(--gold);
  color: var(--text);
}
.modal-content .nav-buttons .btn-done:hover { background: var(--gold-light); }

.modal-content .sunday-info-box {
  background: var(--warm-bg);
  border-radius: 12px;
  padding: 16px 20px;
  margin: 12px 0;
  border: 1px solid rgba(201, 169, 110, 0.2);
}
.modal-content .sunday-info-box .label {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 1px;
  font-weight: 500;
}
.modal-content .sunday-info-box .content {
  font-size: 15px;
  font-weight: 500;
  color: var(--primary);
  margin-top: 2px;
}
.modal-content .sunday-note {
  background: #F5F0E8;
  border-radius: 12px;
  padding: 14px 18px;
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  border: 1px dashed rgba(201, 169, 110, 0.3);
}
.modal-content .sunday-note strong { color: var(--primary); }

.admin-edit-field { margin: 12px 0; }
.admin-edit-field label {
  font-weight: 500; font-size: 13px; display: block; margin-bottom: 4px; color: var(--muted);
}
.admin-edit-field input,
.admin-edit-field textarea,
.admin-edit-field select {
  width: 100%; padding: 10px 14px;
  border: 1.5px solid #E8E0D8; border-radius: 10px;
  font-size: 14px; font-family: var(--font); background: var(--warm-bg);
  transition: var(--transition);
}
.admin-edit-field input:focus,
.admin-edit-field textarea:focus,
.admin-edit-field select:focus {
  border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.12);
}
.admin-edit-field textarea { min-height: 80px; resize: vertical; }
.admin-save-btn {
  background: var(--gold); color: var(--text); border: none;
  padding: 14px; border-radius: 12px; font-weight: 600; font-size: 16px;
  cursor: pointer; width: 100%; margin-top: 12px;
  transition: var(--transition);
}
.admin-save-btn:hover { background: var(--gold-light); }

.admin-footer {
  margin-top: 28px;
  text-align: center;
  padding: 16px 0 4px;
  border-top: 1px solid #F0EAE0;
}
.admin-footer button {
  background: none; border: none; color: var(--muted);
  font-size: 12px; cursor: pointer; padding: 6px 16px; border-radius: 99px;
  transition: var(--transition);
  letter-spacing: 1px;
}
.admin-footer button:hover { background: var(--warm-bg); color: var(--text); }

.password-input {
  padding: 14px 18px; border: 2px solid #E8E0D8; border-radius: 12px;
  font-size: 20px; width: 100%; text-align: center; letter-spacing: 6px; font-weight: 600;
  background: var(--warm-bg);
}
.password-input:focus { border-color: var(--gold); outline: none; }

.toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
  background: rgba(30, 35, 30, 0.92);
  color: #fff; padding: 12px 28px;
  border-radius: 99px; font-size: 14px; z-index: 9999; display: none;
  white-space: nowrap; max-width: 90%;
  overflow: hidden; text-overflow: ellipsis;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  font-weight: 500;
}

.import-section {
  background: var(--warm-bg);
  border-radius: 12px;
  padding: 16px;
  margin: 16px 0;
  border: 2px dashed var(--gold);
  text-align: center;
}
.import-section h3 {
  color: var(--primary);
  margin-bottom: 8px;
}
.import-section p {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 12px;
}
.import-section input[type="file"] {
  display: block;
  margin: 0 auto 10px;
  font-size: 13px;
}
.import-section button {
  background: var(--primary);
  color: #fff;
  border: none;
  padding: 10px 24px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 500;
}
.import-section button:hover { background: var(--primary-light); }

@media (max-width: 420px) {
  body { padding: 12px 10px 80px; }
  .user-area { flex-direction: column; align-items: stretch; }
  .user-area .btn-group { justify-content: stretch; }
  .user-area .btn-group button { flex: 1; text-align: center; }
  .modal-content { padding: 20px 16px; }
  .modal-content .scripture-box { font-size: 14px; padding: 14px 16px; }
  .modal-content .step-indicator .step-dot { font-size: 8px; }
  .stats .item .num { font-size: 22px; }
  .brand .icon { width: 40px; height: 40px; font-size: 26px; }
  .brand-text .name { font-size: 18px; }
}
</style>
</head>
<body>

<div class="app-header">
  <div class="brand">
    <div class="icon">🌿</div>
    <div class="brand-text">
      <div class="name">BILA</div>
      <div class="sub">全年同行 · 门训之旅</div>
    </div>
  </div>
  <div class="header-right">
    <button class="icon-btn" onclick="toggleSettings()">⚙️</button>
  </div>
</div>

<div class="user-area">
  <label>👤</label>
  <input type="text" id="userInput" placeholder="你的名字或邮箱">
  <div class="btn-group">
    <button class="user-btn" onclick="loginUser()">登录</button>
    <button class="guest-btn" onclick="guestLogin()">游客模式</button>
  </div>
  <span class="user-status" id="userStatus"></span>
</div>

<div class="stats">
  <div class="item"><div class="num" id="totalDone">0</div><div class="label">已完成</div></div>
  <div class="item"><div class="num" id="totalDays">364</div><div class="label">全部课程</div></div>
  <div class="item"><div class="num" id="totalPoints">0</div><div class="label">⭐ 积分</div></div>
</div>

<div class="calibration-status">
  <span>📊 内容校准</span>
  <span id="calText">加载中...</span>
</div>

<div class="progress-wrap">
  <div class="top"><span>全年进度</span><span id="progressPercent">0%</span></div>
  <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
  <div class="footprint" id="footprint"></div>
</div>

<div id="courseList"></div>

<div class="admin-footer">
  <button onclick="openAdminLogin()">🔐 管理后台</button>
</div>

<div class="modal-overlay" id="settingsModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeSettings()">✕</button>

// 构建课程数据（不含经文全文，从 state.scriptureData 中获取）
function buildAllCourses() {
  const courses = [];
  let id = 0;
  const roles = ['拓宽眼界', '深入省察', '生活应用', '关系实践', '行动承诺', '轻回顾'];

  const dayThemes = ["默想与看见", "省察与认识", "应用与行动", "关系与实践", "行动与承诺", "回顾与整合"];

  for (let w = 0; w < 52; w++) {
    const weekNum = w + 1;
    // 主日
    const sundayTitle = SUNDAY_TITLES[w] || "主日信息";
    courses.push({
      id: id++,
      week: weekNum,
      dow: 0,
      title: sundayTitle,
      scripture: "路加福音 4:14-21",
      fullScripture: "", // 通过CSV导入或手动编辑
      role: "主日信息入口",
      guide: SUNDAY_GUIDES[w] || "本周主日信息",
      question: "",
      options: [],
      declare: "",
      calibrated: true,
      isSunday: true,
      song: SUNDAY_SONGS[w] || "",
      dayTheme: "主日信息",
      sundayGuide: SUNDAY_GUIDES[w] || ""
    });
    // 周一至周六
    for (let d = 1; d <= 6; d++) {
      const dayTitle = sundayTitle + " · " + dowNames[d-1];
      const opts = ["选项一", "选项二", "选项三", "选项四"];
      courses.push({
        id: id++,
        week: weekNum,
        dow: d,
        title: dayTitle,
        scripture: "约翰福音 1:1-14",
        fullScripture: "",
        role: roles[d-1] || "每日操练",
        guide: "从经文进入今天的真实处境",
        question: "这段经文让你有什么新认识？",
        options: opts,
        declare: "我决定今天以______的态度回应",
        calibrated: true,
        isSunday: false,
        song: "",
        dayTheme: dayThemes[d-1] || ""
      });
    }
  }
  return courses;
}

const ALL_COURSES = buildAllCourses();
const TOTAL = ALL_COURSES.length;

// ================================================================
// 2. 状态管理（含 scriptureData）
// ================================================================
let currentUser = localStorage.getItem('bila_user') || 'default';
const STATE_KEY = 'bila_open_' + currentUser;
let state = {};
function loadState() {
  try { state = JSON.parse(localStorage.getItem(STATE_KEY)) || {}; } catch(e) {}
  state.completed = state.completed || {};
  state.reflections = state.reflections || {};
  state.reminder = state.reminder || { enabled: false };
  state.overrides = state.overrides || {};
  state.scriptureData = state.scriptureData || {}; // 存储 { "week-dow": "经文全文" }
}
function saveState() { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }
loadState();

let filterModule = null;
let isAdmin = false;

function getCourse(id) {
  const c = ALL_COURSES[id];
  if (!c) return null;
  // 优先使用导入的经文全文
  const key = c.week + '-' + c.dow;
  const imported = state.scriptureData && state.scriptureData[key];
  if (imported) {
    c.fullScripture = imported;
  }
  // 如果有手动覆盖，则覆盖
  const over = state.overrides && state.overrides[id];
  if (over && over.fullScripture) {
    c.fullScripture = over.fullScripture;
  }
  return c;
}

function isCompleted(id) { return !!state.completed[id]; }
function getCompletedCount() { return Object.keys(state.completed).filter(k => state.completed[k]).length; }
function getPoints() { return getCompletedCount() * 10; }

function getModuleProgress(mod) {
  let done = 0, total = 0;
  mod.weeks.forEach(w => {
    const c = ALL_COURSES.find(c => c.week === w && c.dow === 0);
    if (c) { total++; if (isCompleted(c.id)) done++; }
  });
  return { done, total };
}
function getCalibrationStats() {
  let calibrated = 0, total = 0;
  ALL_COURSES.forEach(c => { if (c.dow === 0) { total++; if (c.calibrated) calibrated++; } });
  return { calibrated, total };
}

// ================================================================
// 3. 渲染
// ================================================================
function renderStats() {
  const done = getCompletedCount();
  document.getElementById('totalDone').textContent = done;
  document.getElementById('totalDays').textContent = TOTAL;
  document.getElementById('totalPoints').textContent = getPoints();
  const pct = Math.round((done / TOTAL) * 100);
  document.getElementById('progressPercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderCalibrationStatus() {
  const stats = getCalibrationStats();
  const el = document.getElementById('calText');
  if (stats.calibrated === stats.total) {
    el.innerHTML = `<span class="badge done">✅ ${stats.calibrated}/${stats.total} 周已校准</span>`;
  } else {
    el.innerHTML = `<span class="badge pending">📝 ${stats.calibrated}/${stats.total} 周已校准</span>`;
  }
}

function renderFootprint() {
  const container = document.getElementById('footprint');
  container.innerHTML = '';
  MODULES.forEach(mod => {
    const prog = getModuleProgress(mod);
    const isDone = prog.done === prog.total && prog.total > 0;
    const isActive = !isDone && prog.done > 0;
    const step = document.createElement('div');
    step.className = 'step ' + (isDone ? 'done' : (isActive ? 'active' : 'pending'));
    if (filterModule === mod.id) step.classList.add('filter-active');
    step.innerHTML = `<div class="icon">${mod.icon}</div><div class="label">${mod.name}</div>`;
    step.onclick = () => { filterModule = filterModule === mod.id ? null : mod.id; renderAll(); };
    container.appendChild(step);
  });
}

function renderCourseList() {
  const container = document.getElementById('courseList');
  container.innerHTML = '';
  let filtered = ALL_COURSES;
  if (filterModule !== null) {
    const mod = MODULES.find(m => m.id === filterModule);
    if (mod) filtered = ALL_COURSES.filter(c => mod.weeks.includes(c.week));
  }
  let currentWeek = 0, weekDiv = null;
  filtered.forEach((c) => {
    if (c.week !== currentWeek) {
      currentWeek = c.week;
      weekDiv = document.createElement('div');
      weekDiv.className = 'week-section';
      const header = document.createElement('div');
      header.className = 'week-header';
      const dowName = ['主日','周一','周二','周三','周四','周五','周六'][c.dow] || '';
      const isCal = c.calibrated;
      header.innerHTML = `
        📖 第 ${c.week} 周
        <span class="badge">${dowName}</span>
        <span class="status-badge ${isCal ? 'done' : 'pending'}">${isCal ? '✅ 已校准' : '📝 待细化'}</span>
      `;
      weekDiv.appendChild(header);
      container.appendChild(weekDiv);
    }
    const card = document.createElement('div');
    card.className = 'day-card' + (isCompleted(c.id) ? ' done' : '') + (c.isSunday ? ' sunday' : '');
    const dowName = ['主日','周一','周二','周三','周四','周五','周六'][c.dow] || '';
    const isEdited = state.overrides && state.overrides[c.id];
    card.innerHTML = `
      <div class="info">
        <div class="title">
          ${c.title}
          ${isEdited ? '<span class="edit-badge">✎</span>' : ''}
          ${c.isSunday ? '<span class="sunday-tag">📖 主日</span>' : ''}
        </div>
        <div class="meta">
          ${dowName} · ${c.role}
          ${c.isSunday ? '' : '<span class="dot"></span> 10步操练'}
        </div>
      </div>
      <div class="status">${isCompleted(c.id) ? '✅' : '○'}</div>
    `;
    card.onclick = () => openDayModal(c.id);
    weekDiv.appendChild(card);
  });
}

function renderAll() { renderStats(); renderCalibrationStatus(); renderFootprint(); renderCourseList(); }

  const input = document.getElementById('userInput');
  let name = input.value.trim();
  if (!name) { showToast('请输入用户名'); return; }
  currentUser = name;
  localStorage.setItem('bila_user', name);
  STATE_KEY = 'bila_open_' + name;
  loadState();
  renderAll();
  document.getElementById('userStatus').textContent = '当前: ' + name;
  showToast('已登录');
}
function guestLogin() {
  const guestId = 'guest_' + Date.now().toString(36);
  currentUser = guestId;
  localStorage.setItem('bila_user', guestId);
  STATE_KEY = 'bila_open_' + guestId;
  loadState();
  renderAll();
  document.getElementById('userInput').value = '';
  document.getElementById('userStatus').textContent = '当前: 游客';
  showToast('游客模式');
}
function initUser() {
  const stored = localStorage.getItem('bila_user') || 'default';
  if (stored.startsWith('guest_')) {
    document.getElementById('userStatus').textContent = '当前: 游客';
    document.getElementById('userInput').value = '';
  } else {
    document.getElementById('userInput').value = stored;
    document.getElementById('userStatus').textContent = '当前: ' + stored;
  }
}

  // 周间：10步流程
  const steps = ['诵读·进入', '抓住·关键词', '感受·情绪', '连接·场景', '省察·位置', '停顿·默想', '分辨·张力', '决定·微行动', '内化·确认', '宣告·交托'];

        <div class="verses">${c.fullScripture || '（经文全文待导入或手动编辑）'}</div>
      </div>
      <div class="step-action">💡 慢慢读，留意哪个词或短语抓住你的心</div>
    `;
  } else if (currentStep === 1) {
    const opts = c.options && c.options.length > 0 ? c.options : ['选项一', '选项二', '选项三', '选项四'];
    stepContent = `
      <div class="step-title">🔍 第二步：抓住·关键词</div>
      <div class="step-guide">从今天的经文中，哪个词最触动你？</div>
      <div class="options" id="optionsBox">
        ${opts.map((opt, i) => `<button onclick="selectOption(this, '${opt.replace(/'/g,"\\'")}')">${opt}</button>`).join('')}
      </div>
      <div class="declare-box" id="declareBox"></div>
      <div class="step-action">✋ 选择最贴近你感受的一项</div>
    `;
  } else if (currentStep === 2) {
    stepContent = `
      <div class="step-title">❤️ 第三步：感受·情绪</div>
      <div class="step-guide">读这段经文时，你内心的真实感受是什么？</div>
      <div class="options" id="optionsBox">
        <button onclick="selectOption(this, '被触动')">被触动</button>
        <button onclick="selectOption(this, '被挑战')">被挑战</button>
        <button onclick="selectOption(this, '被安慰')">被安慰</button>
        <button onclick="selectOption(this, '说不清')">说不清</button>
      </div>
      <div class="declare-box" id="declareBox"></div>
      <div class="step-action">✋ 选择最真实的那一项</div>
    `;
  } else if (currentStep === 3) {
    stepContent = `
      <div class="step-title">🔗 第四步：连接·场景</div>
      <div class="step-guide">这段经文今天最可能在哪个生活场景中挑战你？</div>
      <div class="options" id="optionsBox">
        <button onclick="selectOption(this, '家庭')">家庭</button>
        <button onclick="selectOption(this, '职场')">职场</button>
        <button onclick="selectOption(this, '教会')">教会</button>
        <button onclick="selectOption(this, '个人独处时')">个人独处时</button>
      </div>
      <div class="declare-box" id="declareBox"></div>
      <div class="step-action">✋ 选一个最可能发生的场景</div>
    `;
  } else if (currentStep === 4) {
    stepContent = `
      <div class="step-title">🪞 第五步：省察·位置</div>
      <div class="step-guide">在今天这个场景中，你处于什么位置？</div>
      <div class="options" id="optionsBox">
        <button onclick="selectOption(this, '我正在被挑战')">我正在被挑战</button>
        <button onclick="selectOption(this, '我需要改变')">我需要改变</button>
        <button onclick="selectOption(this, '我愿意回应')">我愿意回应</button>

      </div>
      <div class="declare-box" id="declareBox"></div>

    `;
  } else if (currentStep === 5) {
    stepContent = `

      <div class="step-guide">安静10-15秒，让刚才的经文和选择沉淀一下……</div>

    `;
  } else if (currentStep === 6) {
    stepContent = `

      <div class="step-guide">在今天的挑战中，你最需要被改变的是什么？</div>
      <div class="options" id="optionsBox">
        <button onclick="selectOption(this, '放下自己的计划')">放下自己的计划</button>
        <button onclick="selectOption(this, '走出舒适区')">走出舒适区</button>
        <button onclick="selectOption(this, '承认自己的有限')">承认自己的有限</button>
        <button onclick="selectOption(this, '相信神的带领')">相信神的带领</button>
      </div>
      <div class="declare-box" id="declareBox"></div>
      <div class="step-action">✋ 选择你最需要被改变的方向</div>
    `;
  } else if (currentStep === 7) {
    stepContent = `
      <div class="step-title">👣 第八步：决定·微行动</div>
      <div class="step-guide">今天你可以走的一小步是什么？</div>
      <div class="options" id="optionsBox">
        <button onclick="selectOption(this, '主动关心一个人')">主动关心一个人</button>
        <button onclick="selectOption(this, '拒绝一件多余的事')">拒绝一件多余的事</button>
        <button onclick="selectOption(this, '做一件善事')">做一件善事</button>
        <button onclick="selectOption(this, '安静在神面前')">安静在神面前</button>
      </div>
      <div class="declare-box" id="declareBox"></div>

    `;
  } else if (currentStep === 8) {
    stepContent = `
      <div class="step-title">✅ 第九步：内化·确认</div>
      <div class="step-guide">你今天的决定是：</div>

        <button style="padding:14px 40px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;" onclick="confirmDecision()">确认我的决定</button>

      <div class="step-action">📌 点击确认，让你的决定变得真实</div>

  } else if (currentStep === 9) {
    stepContent = `
      <div class="step-title">✝️ 第十步：宣告·交托</div>
      <div class="step-guide">把你的决定交托给主：</div>
      <div class="declare-box" style="display:block;font-size:18px;padding:20px;background:#E8F5E9;border-radius:14px;text-align:center;">
        “主，今天我选择 ${selectedOption || '跟随你'}。<br>
        我把它交在你手中，求你带领。”
      </div>
      <div style="text-align:center;margin:12px 0;">
        <button style="padding:14px 40px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;" onclick="completeStep()">🙏 阿们</button>
      </div>
      <div class="step-action">🎯 点击“阿们”，完成今天的操练</div>
    `;
  }

  const stepDots = steps.map((s, i) => {
    let cls = 'step-dot';
    if (i < currentStep) cls += ' done';
    if (i === currentStep) cls += ' active';
    return `<div class="${cls}">${s}</div>`;
  }).join('');

  let navButtons = '';
  if (currentStep < 9) {
    navButtons = `
      <div class="nav-buttons">
        ${currentStep > 0 ? `<button class="btn-prev" onclick="prevStep()">← 返回</button>` : ''}
        <button class="btn-next" id="nextStepBtn" onclick="nextStep()">继续 →</button>
      </div>
    `;
  }

  body.innerHTML = `
    <div class="meta-bar">
      <span>第 ${c.week} 周 · ${dowName}</span>
      <span>${c.role} · ${c.calibrated ? '✅ 已校准' : '📝 待细化'}</span>
    </div>
    <h2 style="margin:4px 0 8px;">${c.title}</h2>
    <div class="step-indicator">${stepDots}</div>
    ${stepContent}
    ${navButtons}
    ${isDone && currentStep === 9 ? '<p style="text-align:center;color:var(--primary);margin-top:12px;">✅ 今日已完成</p>' : ''}
  `;
}

function selectOption(el, opt) {
  document.querySelectorAll('#optionsBox button').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  selectedOption = opt;
  const declareBox = document.getElementById('declareBox');
  if (declareBox) {
    declareBox.textContent = '✍️ 你选择了：' + opt;
    declareBox.style.display = 'block';
  }
  const btn = document.getElementById('nextStepBtn');
  if (btn) btn.disabled = false;
  playClick();
}

function nextStep() {
  if (currentStep === 1 || currentStep === 2 || currentStep === 3 || currentStep === 4 || currentStep === 6 || currentStep === 7) {
    if (!selectedOption) { showToast('请先选择一个选项'); return; }
  }
  if (currentStep < 9) {
    currentStep++;
    const c = getCourse(currentModalId);
    if (c) renderStep(c);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    const c = getCourse(currentModalId);
    if (c) renderStep(c);
  }
}

function confirmDecision() {
  if (!selectedOption) { showToast('请先做出选择'); return; }
  currentStep = 9;
  const c = getCourse(currentModalId);
  if (c) renderStep(c);
}

function completeStep() {
  const id = currentModalId;
  if (isCompleted(id)) { showToast('今日已完成'); return; }
  if (!selectedOption) { showToast('请先完成所有步骤'); return; }
  state.completed[id] = true;
  state.reflections[id] = selectedOption;
  saveState();
  playDecide();
  renderAll();
  showToast('✅ 完成！+10 ⭐');
  setTimeout(() => { closeDayModal(); }, 1500);
}

function markSundayRead(id) {
  if (isCompleted(id)) { showToast('已阅读'); return; }
  state.completed[id] = true;
  state.reflections[id] = '已阅读主日信息';
  saveState();
  renderAll();
  showToast('✅ 已标记为已读');
  setTimeout(() => { closeDayModal(); }, 800);
}

function closeDayModal() {
  document.getElementById('dayModal').classList.remove('active');
  currentStep = 0;
  selectedOption = null;
}

function openAdminLogin() {

  if (document.getElementById('adminPasswordInput').value === ADMIN_PASSWORD) {
    isAdmin = true;
    closeAdminLogin();

function openAdminEdit(id) {
  if (!isAdmin) { showToast('请先登录管理员后台'); return; }
  const c = getCourse(id);
  if (!c) return;
  const over = state.overrides && state.overrides[id];
  const current = over ? { ...c, ...over } : c;
  document.getElementById('adminEditTitle').textContent = `✏️ 第${c.week}周 · ${['主日','周一','周二','周三','周四','周五','周六'][c.dow]} · ${c.title}`;
  const body = document.getElementById('adminEditBody');
  body.innerHTML = `
    <div class="admin-edit-field"><label>标题</label><input type="text" id="afTitle" value="${current.title.replace(/"/g,'&quot;')}"></div>
    <div class="admin-edit-field"><label>经文引用</label><input type="text" id="afScripture" value="${current.scripture.replace(/"/g,'&quot;')}"></div>
    <div class="admin-edit-field"><label>经文全文</label><textarea id="afFull" rows="6">${(current.fullScripture||'').replace(/"/g,'&quot;')}</textarea></div>
    <div class="admin-edit-field"><label>角色/引导</label><input type="text" id="afGuide" value="${current.guide.replace(/"/g,'&quot;')}"></div>
    ${c.isSunday || c.dow === 0 ? `
      <div class="admin-edit-field"><label>主日生活引导句</label><input type="text" id="afSundayGuide" value="${(current.sundayGuide||'').replace(/"/g,'&quot;')}"></div>
      <div class="admin-edit-field"><label>每周一歌</label><input type="text" id="afSong" value="${(current.song||'').replace(/"/g,'&quot;')}"></div>
    ` : `
      <div class="admin-edit-field"><label>步骤选项（逗号分隔）</label><input type="text" id="afOptions" value="${(current.options||[]).join(', ')}"></div>
      <div class="admin-edit-field"><label>宣告句</label><input type="text" id="afDeclare" value="${(current.declare||'').replace(/"/g,'&quot;')}"></div>
    `}
    <button class="admin-save-btn" onclick="saveAdminEdit(${id})">💾 保存修改</button>
    <div style="margin-top:12px;display:flex;gap:8px;">
      <button style="flex:1;padding:12px;background:#e0e0e0;border:none;border-radius:12px;font-weight:600;cursor:pointer;" onclick="adminPrevWeek(${id})">⬅ 上一周</button>
      <button style="flex:1;padding:12px;background:#e0e0e0;border:none;border-radius:12px;font-weight:600;cursor:pointer;" onclick="adminNextWeek(${id})">下一周 ➡</button>
    </div>
    <button style="width:100%;padding:12px;background:#f0f0f0;border:none;border-radius:12px;font-weight:600;cursor:pointer;margin-top:8px;" onclick="closeAdminEdit()">关闭</button>
    <hr style="margin:16px 0;border:1px dashed #E8E0D8;">
    <div class="import-section">
      <h3>📥 批量导入经文全文</h3>
      <p>上传之前生成的CSV文件，自动填充所有课程的经文全文。</p>
      <input type="file" id="csvFileInput" accept=".csv">
      <button onclick="importCSV()">导入CSV</button>
      <div id="importStatus" style="margin-top:8px;font-size:13px;color:var(--muted);"></div>
    </div>
  `;
  document.getElementById('adminEditModal').classList.add('active');
}

function saveAdminEdit(id) {
  const title = document.getElementById('afTitle').value.trim();
  const scripture = document.getElementById('afScripture').value.trim();
  const full = document.getElementById('afFull').value.trim();
  const guide = document.getElementById('afGuide').value.trim();
  if (!title || !scripture || !full || !guide) { showToast('请填写完整'); return; }
  if (!state.overrides) state.overrides = {};
  const update = { title, scripture, fullScripture: full, guide };
  const c = getCourse(id);
  if (c.isSunday || c.dow === 0) {
    const sg = document.getElementById('afSundayGuide')?.value.trim() || '';
    const song = document.getElementById('afSong')?.value.trim() || '';
    update.sundayGuide = sg;
    update.song = song;
  } else {
    const opts = document.getElementById('afOptions').value.split(',').map(s=>s.trim()).filter(Boolean);
    const declare = document.getElementById('afDeclare').value.trim();
    update.options = opts;
    update.declare = declare;
  }
  state.overrides[id] = update;
  saveState();
  renderAll();
  showToast('✅ 已保存');
  openAdminEdit(id);
}

function adminPrevWeek(id) {
  const c = getCourse(id);
  if (!c) return;
  const prev = ALL_COURSES.find(course => course.week === c.week - 1 && course.dow === 0);
  if (prev) openAdminEdit(prev.id);
  else showToast('已是第一周');
}
function adminNextWeek(id) {
  const c = getCourse(id);
  if (!c) return;
  const next = ALL_COURSES.find(course => course.week === c.week + 1 && course.dow === 0);
  if (next) openAdminEdit(next.id);
  else showToast('已是最后一周');
}
function closeAdminEdit() { document.getElementById('adminEditModal').classList.remove('active'); }

// ================================================================
// 7. CSV导入功能
// ================================================================
function importCSV() {
  const fileInput = document.getElementById('csvFileInput');
  const status = document.getElementById('importStatus');
  if (!fileInput.files || fileInput.files.length === 0) {
    status.textContent = '❌ 请先选择CSV文件';
    return;
  }
  const file = fileInput.files[0];
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const text = e.target.result;
      const lines = text.split(/\r?\n/);
      if (lines.length < 2) {
        status.textContent = '❌ CSV文件为空或格式错误';
        return;
      }
      // 解析表头，确定列索引
      const header = lines[0].split(',').map(h => h.trim());
      const weekIdx = header.indexOf('周次');
      const dowIdx = header.indexOf('星期');
      const fullIdx = header.indexOf('经文全文');
      if (weekIdx === -1 || dowIdx === -1 || fullIdx === -1) {
        status.textContent = '❌ CSV缺少必要列：周次、星期、经文全文';
        return;
      }
      let count = 0;
      // 从第2行开始解析
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        // 简单CSV解析（假设无逗号内嵌）
        const cols = lines[i].split(',');
        if (cols.length <= Math.max(weekIdx, dowIdx, fullIdx)) continue;
        const week = parseInt(cols[weekIdx].trim(), 10);
        const dow = parseInt(cols[dowIdx].trim(), 10);
        const fullText = cols[fullIdx] ? cols[fullIdx].trim() : '';
        if (isNaN(week) || isNaN(dow) || !fullText) continue;
        const key = week + '-' + dow;
        state.scriptureData[key] = fullText;
        count++;
      }
      saveState();
      status.textContent = `✅ 导入成功！共导入 ${count} 条经文全文。`;
      renderAll();
      showToast('✅ 经文全文导入完成');
    } catch(err) {
      status.textContent = '❌ 解析失败：' + err.message;
    }
  };
  reader.onerror = function() {
    status.textContent = '❌ 读取文件失败';
  };
  reader.readAsText(file, 'UTF-8');
}

// ================================================================
// 8. 音效、Toast、设置
// ================================================================
let audioCtx = null;
function getAudio() { if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function playTone(freq, dur, vol=0.12) {
  try { const ctx=getAudio(); const o=ctx.createOscillator(); const g=ctx.createGain(); o.type='sine'; o.frequency.value=freq; g.gain.value=vol; g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur); o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime); o.stop(ctx.currentTime+dur); } catch(e) {}
}
function playClick() { playTone(800, 0.06); }
function playDecide() { playTone(1200, 0.12); setTimeout(()=>playTone(1600,0.10),100); }

function showToast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._timer); t._timer=setTimeout(()=>t.style.display='none',2000);
}
function toggleSettings() { document.getElementById('settingsModal').classList.toggle('active'); }
function closeSettings() { document.getElementById('settingsModal').classList.remove('active'); }

function requestNotify() {
  if (!('Notification' in window)) { document.getElementById('notifyStatus').textContent='不支持通知'; return; }
  Notification.requestPermission().then(p => {
    if (p === 'granted') {
      state.reminder.enabled = true; saveState();
      document.getElementById('notifyStatus').textContent = '✅ 提醒已开启';
    } else {
      document.getElementById('notifyStatus').textContent = '❌ 未获得权限';
    }
  });
}
setInterval(() => {
  if (!state.reminder.enabled) return;
  const now = new Date();
  if (now.getHours() === 20 && now.getMinutes() < 3 && Notification.permission === 'granted') {
    new Notification('🌿 BILA 提醒', { body: '今天有课程等你完成哦！' });
  }
}, 60000);
