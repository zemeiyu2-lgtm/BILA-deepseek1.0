<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f5f1e7"
  >

  <title>
    GBRM｜圣经古希腊文入门
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=290"
  >

</head>


<body>


<header class="topbar">

  <div>

    <div class="brand">
      GBRM
    </div>

    <div class="subtitle">
      Greek Bible Reading Model
    </div>

  </div>

  <div class="version">
    V2.9
  </div>

</header>



<main class="app">


<!-- =====================================================
HOME
====================================================== -->

<section
  id="home"
  class="screen active"
>


  <div class="portal-head">

    <div class="eyebrow">
      圣经古希腊文
    </div>

    <h1>
      每天进步一点点
    </h1>

    <p>
      按教材学习。
    </p>

  </div>



  <div class="today-card">

    <div class="today-label">
      今天继续
    </div>

    <div
      id="todayLessonNumber"
      class="today-number"
    >
      L01
    </div>

    <div
      id="todayLessonTitle"
      class="today-title"
    >
      希腊语
    </div>

    <div
      id="todayLessonObjective"
      class="today-objective"
    >
      今天要学习的内容。
    </div>


    <button
      id="continueLesson"
      class="primary wide"
      type="button"
    >
      继续学习 →
    </button>

  </div>



  <div class="progress-card">

    <div class="progress-head">

      <span>
        课程进度
      </span>

      <strong
        id="coursePercent"
      >
        0%
      </strong>

    </div>


    <div class="progress-track">

      <div
        id="courseProgress"
        class="progress-fill"
      ></div>

    </div>


    <div
      id="courseProgressText"
      class="progress-text"
    >
      已完成 0 / 25 课
    </div>

  </div>



  <div class="portal-grid">

    <button
      id="openLessons"
      class="portal-item"
      type="button"
    >

      <span class="portal-icon">
        课程
      </span>

      <strong>
        教材课程
      </strong>

      <small>
        按教材顺序学习
      </small>

    </button>


    <button
      id="startVocabularyReview"
      class="portal-item"
      type="button"
    >

      <span class="portal-icon">
        词汇
      </span>

      <strong>
        词汇复习
      </strong>

      <small>
        复习已经学过的词
      </small>

    </button>

  </div>



  <div
    id="lessonPanel"
    class="card lesson-panel hidden"
  >

    <div class="panel-head">

      <div>

        <div class="eyebrow">
          课程
        </div>

        <h3>
          教材课程
        </h3>

      </div>


      <button
        id="closeLessons"
        class="small-button"
        type="button"
      >
        收起
      </button>

    </div>


    <div
      id="lessonList"
      class="lesson-list"
    ></div>

  </div>



</section>



<!-- =====================================================
LESSON
====================================================== -->

<section
  id="lesson"
  class="screen"
>


  <div class="screen-head">

    <button
      id="lessonBack"
      class="back"
      type="button"
    >
      ←
    </button>


    <div>

      <div
        id="lessonLabel"
        class="eyebrow"
      ></div>

      <h2
        id="lessonTitle"
      ></h2>

    </div>

  </div>



  <div
    id="lessonHeader"
    class="lesson-identity"
  ></div>



  <div class="lesson-progress">

    <div
      id="lessonStepText"
      class="lesson-step-text"
    ></div>


    <div class="progress-track">

      <div
        id="lessonStepProgress"
        class="progress-fill"
      ></div>

    </div>

  </div>



  <div
    id="lessonArea"
  ></div>



  <div class="lesson-actions">

    <button
      id="lessonPrevious"
      class="secondary"
      type="button"
    >
      ← 上一步
    </button>


    <button
      id="lessonNext"
      class="primary"
      type="button"
    >
      下一步 →
    </button>

  </div>


</section>



<!-- =====================================================
VOCAB REVIEW
====================================================== -->

<section
  id="vocabReview"
  class="screen"
>


  <div class="screen-head">

    <button
      id="vocabReviewBack"
      class="back"
      type="button"
    >
      ←
    </button>


    <div>

      <div class="eyebrow">
        词汇复习
      </div>

      <h2>
        再见一次
      </h2>

    </div>

  </div>



  <div class="card">

    <div
      id="vocabReviewCounter"
      class="muted"
    ></div>


    <div
      id="vocabReviewArea"
    ></div>

  </div>


</section>



<!-- =====================================================
CORPUS
====================================================== -->

<section
  id="corpus"
  class="screen"
>


  <div class="screen-head">

    <button
      id="corpusBack"
      class="back"
      type="button"
    >
      ←
    </button>


    <div>

      <div
        id="corpusLabel"
        class="eyebrow"
      ></div>

      <h2>
        原文训练
      </h2>

    </div>

  </div>



  <div
    id="corpusArea"
  ></div>


</section>



<!-- =====================================================
LEMMA
====================================================== -->

<section
  id="lemma"
  class="screen"
>


  <div class="screen-head">

    <button
      id="lemmaBack"
      class="back"
      type="button"
    >
      ←
    </button>


    <div>

      <div class="eyebrow">
        词形
      </div>

      <h2>
        这个词
      </h2>

    </div>

  </div>



  <div
    id="lemmaArea"
  ></div>


</section>



<!-- =====================================================
VERSE
====================================================== -->

<section
  id="verse"
  class="screen"
>


  <div class="screen-head">

    <button
      id="verseBack"
      class="back"
      type="button"
    >
      ←
    </button>


    <div>

      <div class="eyebrow">
        真实新约
      </div>

      <h2>
        经文
      </h2>

    </div>

  </div>



  <div class="card">

    <div
      id="verseReference"
      class="verse-reference"
    ></div>


    <div
      id="verseText"
      class="verse-text"
    ></div>


    <div
      id="verseDetail"
    ></div>

  </div>


  <button
    id="verseBackButton"
    class="secondary wide"
    type="button"
  >
    ← 返回
  </button>


</section>


</main>



<footer>

  GBRM · Greek Bible Reading Model

</footer>



<script
  src="app.js?v=290"
  defer
></script>


</body>
</html>
